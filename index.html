<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Antares V3</title>
  <meta name="description" content="Antares V3: treino pessoal com rodízio, registro de séries, progressão e análise.">
  <meta name="theme-color" content="#e6edf8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Antares">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the forced theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('pk.settings') || '{}').theme;
      var st = JSON.parse(localStorage.getItem('pk.settings') || '{}');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      document.documentElement.setAttribute('data-palette', st.paletteV ? (st.palette || 'blue') : 'blue');
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <a href="#/perfil" class="brand" id="brand" aria-label="Perfil">
      <span class="avatar" id="avatar">K</span>
      <span class="greet"><small id="greet-sub">Antares V3</small><b id="greet-name">Bom treino</b></span>
    </a>
    <div class="topbar-right">
      <a id="session-clock" class="pill accent session-clock" href="#/hoje" hidden aria-label="Tempo de treino"></a>
      <button id="sync-badge" class="sync-badge" title="Sincronização" aria-label="Sincronização"></button>
      <button id="theme-toggle" class="icon-btn" aria-label="Alternar tema"></button>
    </div>
  </header>

  <nav id="backbar" class="backbar" hidden></nav>
  <main id="view" tabindex="-1"></main>

  <div id="rest" class="rest-bar" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="help" class="help"></div>

  <nav class="tabbar" id="tabbar">
    <a href="#/inicio" data-tab="inicio"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6.5 8 6.5V20h-5v-5.5h-6V20H4z"/></svg><span>Início</span></a>
    <a href="#/hoje" data-tab="hoje"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8v8M18 8v8M3 10.5v3M21 10.5v3M6 12h12"/></svg><span>Treino</span></a>
    <a href="#/semana" data-tab="semana"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Semana</span></a>
    <a href="#/progresso" data-tab="progresso"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M7 15l3.5-4 3 2.5L18 8"/><path d="M15 8h3v3"/></svg><span>Progresso</span></a>
    <a href="#/mais" data-tab="mais"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Perfil</span><span class="badge" id="inbox-badge" hidden></span></a>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
